# Publishes a release when a version tag is pushed. The tag must be annotated:
# its first line is the version, and the text under it is the release notes.
#
#   git tag -a v1.1.2 --cleanup=verbatim -F notes.txt   # notes.txt: "v1.1.2", a blank line, the notes
#   git push origin v1.1.2
#
# --cleanup=verbatim keeps the notes' markdown headings: without it git drops
# every line that starts with #. Every theme whose files changed since the
# previous tag must have a new version, or the release stops.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Read the notes from the tag
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ]; then
            echo "::error::$GITHUB_REF_NAME is not an annotated tag, so it has no notes"
            exit 1
          fi
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ] || ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::the message of $GITHUB_REF_NAME has no notes under its first line"
            exit 1
          fi
      - name: The tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check the themes against the previous release
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            node scripts/check.mjs --since "$previous"
          else
            node scripts/check.mjs
          fi
      - name: Build the zips
        run: scripts/pack.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
